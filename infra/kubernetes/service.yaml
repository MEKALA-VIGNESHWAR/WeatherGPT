apiVersion: v1
kind: Service
metadata:
  name: weathergpt-backend-svc
spec:
  type: ClusterIP
  selector:
    app: weathergpt-backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: weathergpt-frontend-svc
spec:
  type: LoadBalancer
  selector:
    app: weathergpt-frontend
  ports:
  - port: 80
    targetPort: 80
